name: CI - Lint y pruebas

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  # Credenciales de un contenedor desechable de CI (no son datos reales)
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: biblio_app
  DB_PASSWORD: ci_password_123
  DB_NAME: biblioteca_db
  SECRET_KEY: clave_solo_para_ci

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: biblioteca_db
          MYSQL_USER: biblio_app
          MYSQL_PASSWORD: ci_password_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint con flake8
        run: flake8 .

      - name: Cargar esquema y datos de prueba
        run: |
          mysql -h 127.0.0.1 -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/schema.sql
          mysql -h 127.0.0.1 -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/seed.sql

      - name: Pruebas con cobertura
        run: pytest --cov=backend tests/
