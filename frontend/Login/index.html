<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login del Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="role">Tipo de Perfil</label>
                <select id="role">
                    <option value="CLIENTE">Cliente</option>
                    <option value="BIBLIOTECARIO">Bibliotecario</option>
                    <option value="ADMINISTRADOR">Administrador</option>
                </select>
            </div>

            <div class="input-group">
                <label for="username" id="usernameLabel">Correo</label>
                <input type="text" id="username" placeholder="Ingresa tu correo" autocomplete="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            </div>


            <button type="submit" id="loginBtn">Entrar</button>
        </form>
        <p id="errorMessage" class="error"></p>
    </div>

    <script src="../sesion.js"></script>
    <script src="script.js"></script>
</body>
</html>
