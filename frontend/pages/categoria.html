<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Biblioteca</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand"><div class="brand-logo">B</div><h2>Biblioteca</h2></div>
            <!-- Pega aquí el mismo <nav class="sidebar-menu"> unificado del Paso 1 (y ponle la clase "active" a Categorías) -->
            <nav class="sidebar-menu">
    <div class="menu-section">
        <p class="section-title">GENERAL</p>
        <a href="../index.html" class="menu-item"><span class="icon">DB</span> Dashboard</a>
    </div>
    <div class="menu-section">
        <p class="section-title">CATÁLOGO</p>
        <a href="libros.html" class="menu-item"><span class="icon">LB</span> Libros</a>
        <a href="categoria.html" class="menu-item"><span class="icon">CA</span> Categorías</a>
    </div>
    <div class="menu-section">
        <p class="section-title">CIRCULACIÓN</p>
        <a href="prestamos.html" class="menu-item"><span class="icon">PR</span> Préstamos</a>
        <a href="clientes.html" class="menu-item"><span class="icon">CL</span> Clientes</a>
    </div>
    <div class="menu-section">
        <p class="section-title">ADMINISTRACIÓN</p>
        <a href="usuarios.html" class="menu-item"><span class="icon">US</span> Usuarios</a>
    </div>
</nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-titles">
                    <h1>Categorías</h1>
                    <p>Organización del catálogo</p>
                </div>
                <button class="btn-primary" onclick="abrirModalCat('nuevo')">+ Nueva Categoría</button>
            </header>

            <section class="dashboard-panels">
                <div class="panel table-panel">
                    <table class="modern-table">
                        <thead>
                            <tr><th>ID</th><th>NOMBRE</th><th>ACCIONES</th></tr>
                        </thead>
                        <tbody id="tabla-categorias">
                            <tr><td colspan="3">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <div id="modal-categoria" class="modal">
                <div class="modal-content">
                    <h2 id="modal-cat-titulo">Nueva Categoría</h2>
                    <form id="form-categoria">
                        <input type="text" id="cat-id" placeholder="ID (ej. C001)" required>
                        <input type="text" id="cat-nombre" placeholder="Nombre (ej. Terror)" required>
                        <div class="modal-actions">
                            <button type="button" class="btn-outline" onclick="cerrarModalCat()">Cancelar</button>
                            <button type="submit" class="btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../app.js"></script>
</body>
</html>
