<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Biblioteca</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand"><div class="brand-logo">B</div><h2>Biblioteca</h2></div>
            <nav class="sidebar-menu">
    <div class="menu-section">
        <p class="section-title">GENERAL</p>
        <a href="../index.html" class="menu-item"><span class="icon">DB</span> Dashboard</a>
    </div>
    <div class="menu-section">
        <p class="section-title">CATÁLOGO</p>
        <a href="libros.html" class="menu-item"><span class="icon">LB</span> Libros</a>
        <a href="categoria.html" class="menu-item"><span class="icon">CA</span> Categorías</a>
    </div>
    <div class="menu-section">
        <p class="section-title">CIRCULACIÓN</p>
        <a href="prestamos.html" class="menu-item"><span class="icon">PR</span> Préstamos</a>
        <a href="clientes.html" class="menu-item"><span class="icon">CL</span> Clientes</a>
    </div>
    <div class="menu-section">
        <p class="section-title">ADMINISTRACIÓN</p>
        <a href="usuarios.html" class="menu-item"><span class="icon">US</span> Usuarios</a>
    </div>
</nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-titles">
                    <h1>Directorio de Clientes</h1>
                    <p>Gestión de miembros de la biblioteca</p>
                </div>
                <button class="btn-primary" onclick="abrirModalCliente('nuevo')">+ Nuevo Cliente</button>
            </header>
            <section class="dashboard-panels">
                <div class="panel table-panel" style="grid-column: span 2;">
                    <table class="modern-table">
                        <thead>
                            <tr><th>ID</th><th>NOMBRE COMPLETO</th><th>CORREO</th><th>TELÉFONO</th><th>ACCIONES</th></tr>
                        </thead>
                        <tbody id="tabla-clientes">
                            <tr><td colspan="5">Cargando clientes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
            
            <div id="modal-cliente" class="modal">
                <div class="modal-content">
                    <h2 id="modal-cliente-titulo">Nuevo Cliente</h2>
                    <form id="form-cliente">
                        <input type="text" id="cli-id" placeholder="ID (ej. CL01)" required>
                        <input type="text" id="cli-nombre" placeholder="Nombre" required>
                        <input type="text" id="cli-apellidop" placeholder="Apellido Paterno" required>
                        <input type="text" id="cli-apellidom" placeholder="Apellido Materno">
                        <input type="email" id="cli-correo" placeholder="Correo Electrónico" required>
                        <input type="text" id="cli-telefono" placeholder="Teléfono" required>
                        <div class="modal-actions">
                            <button type="button" class="btn-outline" onclick="cerrarModalCliente()">Cancelar</button>
                            <button type="submit" class="btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../app.js"></script>
</body>
</html>
