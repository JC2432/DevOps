<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Biblioteca</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">B</div>
                <h2>Biblioteca</h2>
            </div>
            <nav class="sidebar-menu">
    <div class="menu-section">
        <p class="section-title">GENERAL</p>
        <a href="../index.html" class="menu-item"><span class="icon">DB</span> Dashboard</a>
    </div>
    <div class="menu-section">
        <p class="section-title">CATÁLOGO</p>
        <a href="libros.html" class="menu-item"><span class="icon">LB</span> Libros</a>
        <a href="categoria.html" class="menu-item"><span class="icon">CA</span> Categorías</a>
    </div>
    <div class="menu-section">
        <p class="section-title">CIRCULACIÓN</p>
        <a href="prestamos.html" class="menu-item"><span class="icon">PR</span> Préstamos</a>
        <a href="clientes.html" class="menu-item"><span class="icon">CL</span> Clientes</a>
    </div>
    <div class="menu-section">
        <p class="section-title">ADMINISTRACIÓN</p>
        <a href="usuarios.html" class="menu-item"><span class="icon">US</span> Usuarios</a>
    </div>
</nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-titles">
                    <h1>Directorio de Usuarios</h1>
                    <p>Gestión del personal del sistema</p>
                </div>
                <button class="btn-primary" onclick="abrirModalUsuario('nuevo')">+ Nuevo Usuario</button>
            </header>
            <section class="dashboard-panels">
                <div class="panel table-panel" style="grid-column: span 2;">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>USERNAME</th>
                                <th>NOMBRE COMPLETO</th>
                                <th>ROL</th>
                                <th>ACCIONES</th> <!-- Agregamos esta columna -->
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <tr><td colspan="4">Cargando usuarios...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <!-- MODAL DE USUARIOS -->
            <div id="modal-usuario" class="modal">
                <div class="modal-content">
                    <h2 id="modal-usuario-titulo">Nuevo Usuario</h2>
                    <form id="form-usuario">
                        <input type="text" id="usr-id" placeholder="ID (ej. U005)" maxlength="4" required>
                        <select id="usr-cargo" required></select>
                        <input type="text" id="usr-username" placeholder="Nombre de usuario" required>
                        <input type="password" id="usr-password" autocomplete="new-password" minlength="6" required>
                        <input type="text" id="usr-nombre" placeholder="Nombre real" required>
                        <input type="text" id="usr-apellidop" placeholder="Apellido Paterno" required>
                        <input type="text" id="usr-apellidom" placeholder="Apellido Materno">
                        <div class="modal-actions">
                            <button type="button" class="btn-outline" onclick="cerrarModalUsuario()">Cancelar</button>
                            <button type="submit" class="btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../sesion.js"></script>
    <script src="../app.js"></script>
</body>
</html>
